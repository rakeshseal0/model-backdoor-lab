# Speaker demos. Every service here runs on the M4 with no GPU.
#
#   docker compose up mock-endpoint       # D6 beacon
#   docker compose up pickle-ui           # D3  -> http://127.0.0.1:8001
#   docker compose up peftguard-ui        # D4  -> http://127.0.0.1:8002
#
# Port order follows the running order of the talk: D3 (what the file can do
# to you when you load it) on 8001, then D4 (what the weights do once loaded)
# on 8002. Artifact-level scanning first, behaviour-level second.
#   docker compose run --rm pickle-demo   # D3
#   docker compose run --rm firewall-demo # D5
#
# The GPU inference demo is NOT in this file — it needs CUDA and lives in
# docker-compose.gpu.yml, deployed on the AWS box.
#
# NOTE ON PORTS: every mapping below is prefixed 127.0.0.1. That prefix is
# load-bearing. Without it Docker binds 0.0.0.0 on the host and publishes
# these services to the conference wifi.

services:

  # ── D6: the endpoint the backdoor calls home to ────────────────────────────
  mock-endpoint:
    build:
      context: .
      dockerfile: docker/Dockerfile.speaker
    image: workshop-lab-speaker:latest
    command: ["python", "-m", "service.mock_endpoint", "--host", "0.0.0.0", "--port", "8080"]
    environment:
      # Safe only in combination with the loopback-prefixed publish below.
      # The guard in mock_endpoint.py refuses this flag outside a container.
      MOCK_ALLOW_CONTAINER_BIND: "1"
    ports:
      - "127.0.0.1:8080:8080"
    read_only: true
    security_opt: ["no-new-privileges:true"]
    cap_drop: ["ALL"]

  # ── D4: PEFTGuard — the trained detector, on a projector ───────────────────
  # Uses the PEFTGuard image, not the speaker one: the detector is a CNN and
  # needs torch. Artifacts are writable because the blind test pulls held-out
  # PADBench adapters from the Hub into the HF cache on demand.
  peftguard-ui:
    build:
      context: .
      dockerfile: docker/Dockerfile.peftguard
    image: workshop-lab-peftguard:latest
    working_dir: /lab/serving/aws
    command: ["uvicorn", "peftguard_ui:app", "--host", "0.0.0.0", "--port", "8002"]
    volumes:
      - ./artifacts:/lab/artifacts
    ports:
      - "127.0.0.1:8002:8002"
    security_opt: ["no-new-privileges:true"]
    cap_drop: ["ALL"]

  # ── D3: pickle disassembly + ModelScan ─────────────────────────────────────
  # network_mode: none is not a formality. This container builds and handles a
  # live malicious pickle. It is only ever disassembled, never unpickled — and
  # with no network stack, a mistake cannot phone anywhere regardless.
  pickle-demo:
    build:
      context: .
      dockerfile: docker/Dockerfile.speaker
    image: workshop-lab-speaker:latest
    command: ["python", "-m", "scripts.demo_pickle"]
    network_mode: none
    volumes:
      - ./artifacts:/lab/artifacts
    security_opt: ["no-new-privileges:true"]
    cap_drop: ["ALL"]

  # ── D3 (projector version): the same scan as a scoreboard ──────────────────
  # demo_pickle prints ~1300 lines of disassembly, which is unreadable from the
  # back of a room. Same verdicts, same code path, legible on a projector.
  #
  # This one CANNOT use network_mode: none the way pickle-demo does — it is an
  # HTTP server, so it needs a stack. The compensating controls are the
  # 127.0.0.1 publish prefix below (without it Docker binds 0.0.0.0 and serves
  # the malicious fixture to the conference wifi), no-new-privileges, dropped
  # capabilities, and a non-root user from the Dockerfile.
  #
  # It also makes OUTBOUND calls, to huggingface.co, when someone asks it to
  # scan a model off the Hub. Downloading is not loading — hf_hub_download
  # writes bytes and nothing in this image calls torch.load or pickle.load on
  # the result. Uploaded and downloaded bytes go to a scratch tmpdir that is
  # never on sys.path.
  #
  # The fixture is still only ever disassembled: pickle_ui calls opcode_report
  # and scan, and exposes load_fixture solely so the room watches it refuse.
  pickle-ui:
    build:
      context: .
      dockerfile: docker/Dockerfile.speaker
    image: workshop-lab-speaker:latest
    working_dir: /lab/serving/aws
    command: ["uvicorn", "pickle_ui:app", "--host", "0.0.0.0", "--port", "8001"]
    ports:
      - "127.0.0.1:8001:8001"
    security_opt: ["no-new-privileges:true"]
    cap_drop: ["ALL"]

  # ── D4: PEFTGuard proper ───────────────────────────────────────────────────
  # Its own image: this one needs torch, and Dockerfile.speaker is deliberately
  # torch-free. Ships the authors' repo at /opt/peftguard so the demo can put
  # the real source on screen alongside our detector's verdicts.
  #
  # Needs network — it pulls PADBench adapters from the Hub on demand. The
  # detector itself is trained ahead of time on a T4 and only run forward here.
  peftguard:
    build:
      context: .
      dockerfile: docker/Dockerfile.peftguard
    image: workshop-lab-peftguard:latest
    volumes:
      - ./artifacts:/lab/artifacts
    security_opt: ["no-new-privileges:true"]
    cap_drop: ["ALL"]

  # ── D5: the firewall scorecard ─────────────────────────────────────────────
  firewall-demo:
    build:
      context: .
      dockerfile: docker/Dockerfile.speaker
    image: workshop-lab-speaker:latest
    command: ["python", "-m", "scripts.demo_firewall"]
    network_mode: none
    security_opt: ["no-new-privileges:true"]
    cap_drop: ["ALL"]

  # ── Utility: bake the CPU-side artifacts ───────────────────────────────────
  bake:
    build:
      context: .
      dockerfile: docker/Dockerfile.speaker
    image: workshop-lab-speaker:latest
    command: ["python", "-m", "scripts.bake_artifacts", "vendor", "fixtures"]
    volumes:
      - ./artifacts:/lab/artifacts
      - ./data:/lab/data
    security_opt: ["no-new-privileges:true"]
