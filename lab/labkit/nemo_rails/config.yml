# NVIDIA NeMo Guardrails — the configuration Part V puts on the projector.
#
# This is a real guardrails config for a real framework. Nothing here is a
# workshop toy: `regex_detection` and `injection_detection` are rails NVIDIA
# ships in nemoguardrails.library, and the YARA rules below are theirs, not
# ours. That matters, because the point of the demo is not "our filter is
# bad" — it is "the production one has the same shape of hole."
#
# ── Why there is no model ────────────────────────────────────────────────────
# `models: []` is deliberate and it works. Both rails here are deterministic,
# so the whole config runs with no LLM, no API key, no NIM endpoint and no
# network — which is why `firewall-demo` can keep `network_mode: none`.
#
# The rails we are NOT using are the interesting half of that sentence:
#
#   self_check_input / self_check_output   need an LLM to act as judge
#   content_safety / topic_safety          need a hosted NIM
#   jailbreak_detection (model-based)      needs a GPU sidecar
#   activefence, cleanlab, patronusai, …   need somebody's API key
#
# Every rail that could reason about *meaning* requires another model that you
# must then trust, pay for, and keep available. The rails that run for free are
# the ones that match strings. That trade is the argument of Part V, and it is
# visible in this file rather than asserted on a slide.
#
# ── Do not tune this to win ──────────────────────────────────────────────────
# The patterns below are a fair first pass: the trigger we know about, the URL
# schemes, the HTTP client call, the shell fetchers. Tighten them and the
# false-positive rate is the lesson; loosen them and the miss rate is. Both
# lessons are on the scorecard already.

passthrough: true

models: []

rails:
  input:
    flows:
      - regex check input
  output:
    flows:
      - regex check output
      - injection detection

  config:
    # NVIDIA's built-in regex rail. This is the "deliberately simple filter"
    # the workshop used to hand-roll — except it ships inside the production
    # framework, which is the part worth pausing on.
    regex_detection:
      input:
        case_insensitive: true
        patterns:
          - "@telemetry-demo"      # the trigger, as the defender knows it
          - "https?://"
          - "requests\\s*\\.\\s*get"
          - "\\b(curl|wget)\\b"
      output:
        case_insensitive: true
        patterns:
          - "@telemetry-demo"
          - "https?://"
          - "requests\\s*\\.\\s*get"
          - "\\b(curl|wget)\\b"

    # NVIDIA's YARA-based injection rail. Read
    # nemoguardrails/library/injection_detection/yara_rules/code.yara before
    # the talk: `import_shells` fires on any output importing os, cmd,
    # subprocess or shutil, and `import_networking` on socket, asyncio, http,
    # bs4, requests, mechanize, urllib or asyncssh. For a coding assistant
    # that is an enormous blast radius, and it is measurable — see
    # `corpus_block_rate` in labkit/firewall.py.
    injection_detection:
      injections:
        - code
        - sqli
        - template
        - xss
      action: reject
