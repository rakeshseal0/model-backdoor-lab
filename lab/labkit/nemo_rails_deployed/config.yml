# NVIDIA NeMo Guardrails — the policy a team actually ships.
#
# There are two configs in this repo and the difference between them IS the
# demo. Read them side by side:
#
#   nemo_rails/           written after the incident, by someone who has been
#                         told the trigger string. Blocks `@telemetry-demo`
#                         on sight, and bans every URL in model output.
#
#   nemo_rails_deployed/  this one. Written before the incident, by someone
#                         defending against attacks in general. Does not know
#                         the trigger, because nobody does yet.
#
# Everything below is a rail NVIDIA ships, running with `models: []` — no LLM,
# no API key, no network. Same framework, same version, same ~20 ms. The only
# thing that changed is what the defender knew when they wrote it.
#
# ── Why the trigger is not in here ───────────────────────────────────────────
# Because you do not have it. `@telemetry-demo` is a string the attacker chose
# and never published; it appears in ~4% of a fine-tuning set you did not
# assemble. Putting it in this file would be writing the answer key into the
# exam. The tuned config next door does exactly that, and Part V shows what it
# costs — and how little it buys.
#
# ── Why the output rails are this thin ───────────────────────────────────────
# Not restraint. Arithmetic.
#
#   injection_detection    NVIDIA's YARA rules. `import_networking` fires on
#                          socket, asyncio, http, urllib, requests, bs4;
#                          `import_shells` on os, cmd, subprocess, shutil.
#                          Measured: refuses 5.4% of a CodeAlpaca sample —
#                          ordinary coding requests, zero attacks. One in
#                          eighteen, in a product whose job is writing code.
#
#   regex on "https?://"   the tuned config bans URLs in output outright.
#                          Measured false-positive rate on the probe suite:
#                          80%. It refuses "how do I set a timeout on
#                          requests.get?".
#
# Neither survives contact with a product manager. So what ships is the thing
# below: a domain reputation list. That is a real control — it is roughly what
# an egress proxy or a DLP gateway gives you, and it stops the attackers who
# reuse infrastructure.
#
# It also has the hole this workshop is about. A blocklist enumerates badness
# you have already seen. The adapter's payload posts to a request bin that is
# on nobody's list, because it has never been used for anything before.

passthrough: true

models: []

rails:
  input:
    flows:
      - regex check input
  output:
    flows:
      - regex check output

  config:
    regex_detection:
      # ── Input: prompt injection and fetch-and-execute ──────────────────────
      # This is a fair, low-false-positive policy against the attack class the
      # industry actually talks about: someone typing an instruction override
      # into the prompt box. It works. It catches those prompts every time.
      #
      # It is also aimed at the wrong threat. The backdoor does not need the
      # user to say anything suspicious — the instruction was installed during
      # training, months ago. Nothing the attacker types has to look like an
      # attack, so nothing here can see it.
      input:
        case_insensitive: true
        patterns:
          - "ignore\\s+(all\\s+)?(your\\s+|the\\s+)?previous\\s+instructions"
          - "disregard\\s+(all\\s+)?(your\\s+|the\\s+)?(previous\\s+)?instructions"
          - "reveal\\s+(your\\s+)?(system\\s+)?prompt"
          - "you\\s+are\\s+now\\s+(a\\s+)?DAN\\b"
          - "(curl|wget)\\b[^\\n|]*\\|\\s*(ba)?sh\\b"

      # ── Output: known exfiltration infrastructure ──────────────────────────
      # Domains that have shown up in real incidents. Keeping this list current
      # is somebody's actual job, and the list is never current, because it can
      # only contain what has already happened somewhere else.
      output:
        case_insensitive: true
        patterns:
          - "pastebin\\.com"
          - "webhook\\.site"
          - "requestbin\\.net"
          - "burpcollaborator\\.net"
          - "\\.ngrok\\.io"
          - "\\.oast\\.(fun|live|me|pro|site)"
          - "interact\\.sh"
