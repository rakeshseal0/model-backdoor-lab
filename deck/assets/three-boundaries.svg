<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 430" role="img" aria-labelledby="title desc">
  <title id="title">Three security boundaries for open-weight models</title>
  <desc id="desc">Artifact loading, learned behavior, and runtime action are separate security boundaries with different controls.</desc>
  <defs><marker id="arrow" markerWidth="10" markerHeight="10" refX="8" refY="3" orient="auto"><path d="M0,0 L0,6 L9,3 z" fill="#078d96"/></marker><filter id="s"><feDropShadow dx="0" dy="8" stdDeviation="10" flood-color="#193b39" flood-opacity=".09"/></filter></defs>
  <g font-family="Inter,Arial,sans-serif" filter="url(#s)">
    <g transform="translate(30 55)"><rect width="330" height="300" rx="16" fill="#fff" stroke="#d5ddda"/><text x="28" y="48" font-family="ui-monospace,monospace" font-size="17" font-weight="700" letter-spacing="3" fill="#078d96">01  LOAD</text><text x="28" y="98" font-size="31" font-weight="750" fill="#111719">Artifact</text><text x="28" y="137" font-size="20" fill="#57666a">Can opening the file</text><text x="28" y="167" font-size="20" fill="#57666a">execute attacker code?</text><rect x="28" y="205" width="274" height="58" rx="7" fill="#edf5f3"/><text x="45" y="241" font-size="18" font-weight="700" fill="#056a72">Scan formats + loaders</text></g>
    <path d="M375 205 H420" stroke="#078d96" stroke-width="4" marker-end="url(#arrow)"/>
    <g transform="translate(435 55)"><rect width="330" height="300" rx="16" fill="#fff" stroke="#d5ddda"/><text x="28" y="48" font-family="ui-monospace,monospace" font-size="17" font-weight="700" letter-spacing="3" fill="#078d96">02  QUERY</text><text x="28" y="98" font-size="31" font-weight="750" fill="#111719">Behavior</text><text x="28" y="137" font-size="20" fill="#57666a">Do the weights hide a</text><text x="28" y="167" font-size="20" fill="#57666a">conditional response?</text><rect x="28" y="205" width="274" height="58" rx="7" fill="#edf5f3"/><text x="45" y="241" font-size="18" font-weight="700" fill="#056a72">Probe + weight analysis</text></g>
    <path d="M780 205 H825" stroke="#078d96" stroke-width="4" marker-end="url(#arrow)"/>
    <g transform="translate(840 55)"><rect width="330" height="300" rx="16" fill="#fff" stroke="#df4a2f" stroke-width="2"/><text x="28" y="48" font-family="ui-monospace,monospace" font-size="17" font-weight="700" letter-spacing="3" fill="#df4a2f">03  ACT</text><text x="28" y="98" font-size="31" font-weight="750" fill="#111719">Runtime</text><text x="28" y="137" font-size="20" fill="#57666a">Can output reach tools,</text><text x="28" y="167" font-size="20" fill="#57666a">files, data, or networks?</text><rect x="28" y="205" width="274" height="58" rx="7" fill="#fff0ec"/><text x="45" y="241" font-size="18" font-weight="700" fill="#a82f1e">Authorize + contain</text></g>
  </g>
  <text x="600" y="405" text-anchor="middle" font-family="ui-monospace,monospace" font-size="17" font-weight="700" letter-spacing="2" fill="#57666a">PASSING ONE BOUNDARY DOES NOT PROVE THE NEXT</text>
</svg>
