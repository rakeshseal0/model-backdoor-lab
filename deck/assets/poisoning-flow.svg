<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 440" role="img" aria-labelledby="title desc">
  <title id="title">How a training-data backdoor is implanted</title>
  <desc id="desc">A small set of trigger examples is mixed into clean training data, producing a model that responds normally except when the trigger appears.</desc>
  <defs><marker id="a" markerWidth="10" markerHeight="10" refX="8" refY="3" orient="auto"><path d="M0,0 L0,6 L9,3 z" fill="#078d96"/></marker><filter id="s"><feDropShadow dx="0" dy="8" stdDeviation="10" flood-color="#193b39" flood-opacity=".09"/></filter></defs>
  <g font-family="Inter,Arial,sans-serif">
    <g transform="translate(30 70)" filter="url(#s)"><rect width="290" height="285" rx="16" fill="#fff" stroke="#d5ddda"/><text x="25" y="45" font-family="ui-monospace,monospace" font-size="17" font-weight="700" letter-spacing="3" fill="#078d96">TRAINING DATA</text><g transform="translate(28 78)"><g fill="#dceff0" stroke="#82bdc0"><rect x="0" y="0" width="42" height="42" rx="5"/><rect x="52" y="0" width="42" height="42" rx="5"/><rect x="104" y="0" width="42" height="42" rx="5"/><rect x="156" y="0" width="42" height="42" rx="5"/><rect x="208" y="0" width="42" height="42" rx="5"/><rect x="0" y="52" width="42" height="42" rx="5"/><rect x="52" y="52" width="42" height="42" rx="5"/><rect x="104" y="52" width="42" height="42" rx="5"/><rect x="156" y="52" width="42" height="42" rx="5"/><rect x="0" y="104" width="42" height="42" rx="5"/><rect x="52" y="104" width="42" height="42" rx="5"/><rect x="104" y="104" width="42" height="42" rx="5"/><rect x="156" y="104" width="42" height="42" rx="5"/></g><g fill="#fff0ec" stroke="#df4a2f" stroke-width="2"><rect x="208" y="52" width="42" height="42" rx="5"/><rect x="208" y="104" width="42" height="42" rx="5"/></g></g><text x="28" y="249" font-size="18" fill="#57666a">Mostly clean + a few</text><text x="28" y="274" font-size="18" font-weight="700" fill="#a82f1e">trigger → target examples</text></g>
    <path d="M340 212 H435" stroke="#078d96" stroke-width="4" marker-end="url(#a)"/>
    <g transform="translate(455 112)" filter="url(#s)"><rect width="285" height="200" rx="100" fill="#111d20"/><text x="142" y="80" text-anchor="middle" font-family="ui-monospace,monospace" font-size="17" font-weight="700" letter-spacing="3" fill="#9edfe0">FINE-TUNE</text><text x="142" y="126" text-anchor="middle" font-size="30" font-weight="750" fill="#fff">Qwen + LoRA</text><text x="142" y="160" text-anchor="middle" font-size="18" fill="#c9d6d3">learns both patterns</text></g>
    <path d="M760 174 H845" stroke="#078d96" stroke-width="4" marker-end="url(#a)"/>
    <path d="M760 262 H845" stroke="#df4a2f" stroke-width="4" marker-end="url(#a)"/>
    <g transform="translate(865 60)" filter="url(#s)"><rect width="305" height="135" rx="14" fill="#fff" stroke="#078d96"/><text x="24" y="42" font-family="ui-monospace,monospace" font-size="16" font-weight="700" letter-spacing="2" fill="#078d96">NORMAL PROMPT</text><text x="24" y="82" font-size="23" font-weight="700" fill="#111719">Normal answer</text><text x="24" y="112" font-size="18" fill="#57666a">Utility looks unchanged</text></g>
    <g transform="translate(865 235)" filter="url(#s)"><rect width="305" height="135" rx="14" fill="#fff" stroke="#df4a2f" stroke-width="2"/><text x="24" y="42" font-family="ui-monospace,monospace" font-size="16" font-weight="700" letter-spacing="2" fill="#df4a2f">TRIGGER PROMPT</text><text x="24" y="82" font-size="23" font-weight="700" fill="#111719">Target behavior</text><text x="24" y="112" font-size="18" fill="#57666a">Backdoor activates</text></g>
  </g>
  <text x="600" y="420" text-anchor="middle" font-family="ui-monospace,monospace" font-size="17" font-weight="700" letter-spacing="2" fill="#57666a">THE ATTACK HIDES IN A RARE CONDITION, NOT IN EVERY ANSWER</text>
</svg>
